<svg width="100" height="100" viewBox="0 0 100 100"
     xmlns="http://www.w3.org/2000/svg"
     aria-label="Solar System Icon">
  <rect width="100" height="100" fill="none"/>
  <circle cx="50" cy="50" r="15" fill="#FFDD33" />
  <circle cx="50" cy="50" r="30" fill="none" stroke="#999" stroke-width="0.5"/>
  <g>
    <circle cx="80" cy="50" r="3" fill="#4CAF50"/>
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 50 50"
      to="360 50 50"
      dur="6s"
      repeatCount="indefinite"
    />
  </g>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#999" stroke-width="0.5"/>
  <g>
    <circle cx="90" cy="50" r="2.5" fill="#2196F3"/>
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="360 50 50"
      to="0 50 50"
      dur="10s"
      repeatCount="indefinite"
    />
  </g>
</svg>


